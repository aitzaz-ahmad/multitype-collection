name: cppcheck analysis

on: [push, pull_request]

jobs:
  cppcheck:
    name: cppcheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck ninja-build

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cppcheck ninja

      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cppcheck ninja -y

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run cppcheck
        run: |
          cppcheck \
            --project=build/compile_commands.json \
            --enable=all \
            --inline-suppr \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --quiet
